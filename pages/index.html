<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1a14" />
    <title>Retro Season Replay</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The app runs on Render; this address only forwards to it. -->
    <meta http-equiv="refresh" content="0; url=https://fantasy-lockout.onrender.com/" />
    <script>
      // Keep any deep link (/fantasy-lockout-app/league/ABC -> /league/ABC).
      var path = location.pathname.replace(/^\/fantasy-lockout-app/, '') || '/';
      location.replace('https://fantasy-lockout.onrender.com' + path + location.search + location.hash);
    </script>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #0d1512; color: #e8f0ea; font: 16px system-ui, sans-serif; }
      a { color: #4ade80; }
    </style>
  </head>
  <body>
    <p>Taking you to <a href="https://fantasy-lockout.onrender.com/">Retro Season Replay</a>…</p>
  </body>
</html>
