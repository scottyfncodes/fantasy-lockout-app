# Render blueprint. In the Render dashboard: New → Blueprint → pick this repo.
#
# One service, because that is what the app is: a single Python process holding
# the draft-room WebSockets, the nightly scheduler and the SQLite file, with
# the built React bundle served from the same origin.
services:
  - type: web
    name: fantasy-lockout
    runtime: docker
    plan: starter          # free tier sleeps, and a sleeping app misses the 8pm sim
    region: ohio
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      # League state lives here. Without a disk, every deploy would wipe the
      # draft, the rosters and the season standings.
      #
      # Sized for about 100 leagues. Measured: a league costs roughly 6 MB for
      # a full replayed season, and the shared season cache about 11 MB a year
      # — so 100 leagues over seventeen seasons is around 800 MB, which is too
      # close to 1 GB to be comfortable. Disk is the only thing that actually
      # limits how many leagues run at once; raising this raises the ceiling
      # in a straight line.
      name: replay-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: RETRO_REPLAY_DB
        value: /data/replay.sqlite3
      # Real players, from Retrosheet's own event files. Cached on first boot
      # before the server binds, at roughly 90 seconds a season — so this
      # first deploy sits for about six minutes looking like it has hung. It
      # has not. Narrow to a single year to get up faster, or widen once the
      # disk is warm; either way it only happens once.
      # The full span the injury export covers, so every season the draw can
      # land on has real injuries. Seventeen seasons is roughly 25 minutes of
      # caching on a fresh disk and about 190 MB — but the server comes up
      # first now and shows progress, so it is a wait, not an outage.
      - key: RETRO_SEASONS
        value: 2001-2017
      - key: RETRO_SOURCE
        value: retrosheet
      # The injury feed is a second site and blocks some hosts. If it answers
      # Render, seasons get their real injuries and this changes nothing; if
      # it 403s, the season stays playable and the app says injuries are
      # missing, rather than refusing to start a league at all.
      - key: RETRO_ALLOW_MISSING_IL
        value: "1"
      - key: TZ
        value: America/Chicago
